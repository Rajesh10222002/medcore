# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - medcore-rajesh-2026

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This repo is a monorepo: the React frontend lives in frontend/ and the
      # Flask backend in backend/. Only backend/ is the deployable App Service
      # unit (it has app.py + requirements.txt), and app.py serves the built
      # frontend as static files from backend/static_frontend/ (see
      # backend/app.py's serve_frontend route and build.sh, which does this
      # same build+copy for local/manual deploys).
      - name: Build frontend and copy into backend
        run: |
          cd frontend
          npm ci
          npm run build
          mkdir -p ../backend/static_frontend
          cp -r dist/* ../backend/static_frontend/

      # Oryx (server-side build, triggered by SCM_DO_BUILD_DURING_DEPLOYMENT=true
      # on the Web App) runs pip install for us from whatever is at the zip's
      # root, so the zip's root must be backend/'s contents, not the repo root.
      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../release.zip . -x "*.pyc" "__pycache__/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'medcore-rajesh-2026'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_410DF1DE0B2B4C40BBCA65CBAC75BBE0 }}
